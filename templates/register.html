<!DOCTYPE html>
<html>
<head>
    <title>Inscription</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header text-center">

                    <h3>Inscription</h3>

                </div>

                <div class="card-body">

                    {% with messages = get_flashed_messages(with_categories=true) %}

                        {% if messages %}

                            {% for categorie, message in messages %}

                                <div class="alert alert-{{ categorie }} alert-dismissible fade show">

                                    {{ message }}

                                    <button
                                        type="button"
                                        class="btn-close"
                                        data-bs-dismiss="alert">
                                    </button>

                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">

                            <label class="form-label">
                                Nom
                            </label>

                            <input
                                type="text"
                                name="nom"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Mot de passe
                            </label>

                            <input
                                type="password"
                                name="mot_de_passe"
                                class="form-control"
                                required>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            S'inscrire

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
