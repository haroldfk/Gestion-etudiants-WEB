{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    ➕ Ajouter une note
</h2>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">

        <label class="form-label">
            Matière
        </label>

        <select
            name="matiere"
            class="form-select"
            required>

            <option value="">
                -- Choisir une matière --
            </option>

            {% for matiere in matieres %}

                <option value="{{ matiere.nom }}">
                    {{ matiere.nom }}
                </option>

            {% endfor %}

        </select>

    </div>

    <div class="mb-3">

        <label class="form-label">
            Note
        </label>

        <input
            type="number"
            step="0.01"
            name="note"
            class="form-control"
            min="0"
            max="20"
            required>

    </div>

    <button
        type="submit"
        class="btn btn-success">

        Ajouter

    </button>

    <a
        href="javascript:history.back()"
        class="btn btn-secondary">

        Retour

    </a>

</form>

{% endblock %}
