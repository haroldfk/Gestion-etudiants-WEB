{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h1 class="mb-4">Liste des étudiants</h1>

    <form method="GET" class="mb-4">

        <div class="row">

            <div class="col-md-6">

                <input
                    type="text"
                    name="recherche"
                    class="form-control"
                    placeholder="Rechercher un étudiant"
                    value="{{ request.args.get('recherche', '') }}"
                >

            </div>

            <div class="col-md-2">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Rechercher

                </button>

            </div>

            <div class="col-md-2">

                <a href="/export_csv"
                   class="btn btn-success">

                    Exporter CSV

                </a>

            </div>

        </div>

    </form>

    <table class="table table-striped table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Age</th>
                <th>Filière</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

            {% for etudiant in etudiants %}

            <tr>

                <td>{{ etudiant.id }}</td>
                <td>{{ etudiant.nom }}</td>
                <td>{{ etudiant.prenom }}</td>
                <td>{{ etudiant.age }}</td>
                <td>{{ etudiant.filiere }}</td>

               <td>

                    <a href="/notes/{{ etudiant.id }}"
                       class="btn btn-info btn-sm">
                        Notes
                    </a>

                    <a href="/modifier_etudiant/{{ etudiant.id }}"
                       class="btn btn-warning btn-sm">
                        Modifier
                    </a>

                    <form
                        method="POST"
                        action="/supprimer_etudiant/{{ etudiant.id }}"
                        class="d-inline"
                        onsubmit="return confirm('Voulez-vous vraiment supprimer cet étudiant ?')">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-danger btn-sm">
                            Supprimer
                        </button>
                    </form>

                    <a href="/absences/{{ etudiant.id }}"
                       class="btn btn-secondary btn-sm">

                        Absences

                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
