{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    📚 Matières de {{ enseignant.prenom }} {{ enseignant.nom }}
</h2>

<div class="card shadow-lg">

    <div class="card-body">

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            {% if matieres %}

                <div class="row">

                    {% for matiere in matieres %}

                        <div class="col-md-6 col-xl-4 mb-3">

                            <div class="border rounded bg-light p-3 h-100">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        name="matieres"
                                        value="{{ matiere.id }}"
                                        id="matiere_{{ matiere.id }}"
                                        {% if matiere.id in matieres_selectionnees %}checked{% endif %}>

                                    <label
                                        class="form-check-label fw-semibold"
                                        for="matiere_{{ matiere.id }}">

                                        {{ matiere.nom }}

                                    </label>

                                </div>

                            </div>

                        </div>

                    {% endfor %}

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Enregistrer

                </button>

            {% else %}

                <div class="alert alert-warning mb-0">

                    ⚠️ Aucune matière disponible.
                    Vous devez d'abord créer au moins une matière.

                </div>

            {% endif %}

            <a
                href="/enseignants"
                class="btn btn-secondary">

                Retour

            </a>

        </form>

    </div>

</div>

{% endblock %}
