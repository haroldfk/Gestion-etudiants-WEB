{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    ✏️ Modifier une matière
</h2>

<div class="card shadow-lg">

    <div class="card-body">

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">

                <label class="form-label">
                    Nom de la matière
                </label>

                <input
                    type="text"
                    name="nom"
                    class="form-control"
                    value="{{ matiere.nom }}"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-warning">

                Enregistrer

            </button>

            <a
                href="/matieres"
                class="btn btn-secondary">

                Retour

            </a>

        </form>

    </div>

</div>

{% endblock %}
